name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Test core
        run: go test ./...

      - name: Test desktop
        working-directory: desktop
        run: go test ./...

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build application
        working-directory: desktop
        run: wails build -clean -trimpath -o PrinterOne.exe -webview2 browser

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PrinterOne-windows-amd64
          path: desktop/build/bin/PrinterOne.exe
          if-no-files-found: error
