name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # Wails generates frontend/wailsjs before invoking Vite and creates
      # frontend/dist, both of which are intentionally excluded from Git.
      - name: Build application
        working-directory: desktop
        run: wails build -clean -trimpath -o PrinterOne.exe -webview2 browser

      - name: Test core
        run: go test ./...

      - name: Test desktop
        working-directory: desktop
        run: go test ./...

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PrinterOne-windows-amd64
          path: desktop/build/bin/PrinterOne.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "desktop/build/bin/PrinterOne.exe#PrinterOne.exe"
          --repo "${{ github.repository }}"
          --title "PrinterOne ${{ github.ref_name }}"
          --generate-notes
          --verify-tag
